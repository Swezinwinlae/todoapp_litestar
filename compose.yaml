
services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    build: ./backend
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/litestar_app
    depends_on:
      - database

  database:
    image: postgres:17
    environment:
      POSTGRES_DB: todos_litestar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1982003
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

volumes:
  postgres_data:
